name: Build Android Venue Server download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/venue/**', 'android/settings.gradle', 'src/**', 'venue-server/validate.mjs', 'scripts/prepare-venue-android.mjs', '.github/workflows/venue-android-release.yml']
permissions:
  contents: write
concurrency:
  group: venue-android-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      REFOS_ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: node scripts/prepare-venue-android.mjs
      - name: Restore existing Android app key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          value=os.environ.get('ANDROID_KEYSTORE_BASE64')
          if not value: raise SystemExit('Existing ANDROID_KEYSTORE_BASE64 secret is required for installable updates.')
          pathlib.Path(os.environ['RUNNER_TEMP'],'refos-venue.p12').write_bytes(base64.b64decode(value,validate=True))
          PY
      - name: Build and test Android server
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/refos-venue.p12
        run: |
          chmod +x gradlew
          ./gradlew :venue:testDebugUnitTest :venue:assembleRelease --console=plain
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/venue/build/outputs/apk/release/venue-release.apk Ref-OS-Venue-Server.apk
          gh release view venue-server-android || gh release create venue-server-android --title 'Ref OS Venue Server for Android' --notes 'Install on one Android host and tap Start Server. Keep it powered on and connected to venue Wi-Fi.'
          gh release upload venue-server-android Ref-OS-Venue-Server.apk --clobber
